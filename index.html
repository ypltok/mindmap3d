<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="考えを立体で広げる3Dマインドマップ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#E8ECF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D121B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="3Dマップ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>html{color-scheme:light dark}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}</style>
</head>
<body>
<title>3D Mind Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: full-bleed 3D stage, floating top bar, contextual bottom dock for the selected node */
:root{
  --bg:#E8ECF2; --bg2:#F9FAFC; --fg:#18202C; --muted:#5B6676;
  --panel:rgba(255,255,255,.88); --panel-solid:#FFFFFF; --line:#D3D9E2;
  --accent:#3B57D9; --accent-fg:#FFFFFF; --accent-soft:rgba(59,87,217,.12);
  --chip:rgba(255,255,255,.92); --node:rgba(255,255,255,.9); --chip-line:rgba(24,32,44,.12);
  --danger:#C23A2E; --shadow:0 8px 28px rgba(24,32,44,.14);
  --font-ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-latin:"Space Grotesk","Zen Kaku Gothic New",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D121B; --bg2:#1A2335; --fg:#E7ECF3; --muted:#9AA6B8;
  --panel:rgba(21,28,41,.9); --panel-solid:#161D2A; --line:#2A3448;
  --accent:#8FA3FF; --accent-fg:#0D121B; --accent-soft:rgba(143,163,255,.16);
  --chip:rgba(19,26,38,.86); --node:rgba(17,23,37,.86); --chip-line:rgba(231,236,243,.14);
  --danger:#FF7A6E; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D121B; --bg2:#1A2335; --fg:#E7ECF3; --muted:#9AA6B8;
  --panel:rgba(21,28,41,.9); --panel-solid:#161D2A; --line:#2A3448;
  --accent:#8FA3FF; --accent-fg:#0D121B; --accent-soft:rgba(143,163,255,.16);
  --chip:rgba(19,26,38,.86); --node:rgba(17,23,37,.86); --chip-line:rgba(231,236,243,.14);
  --danger:#FF7A6E; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 42%,var(--bg2) 0%,var(--bg) 72%)}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.lbl{position:absolute;left:0;top:0;transform-origin:50% 50%;white-space:normal;display:flex;align-items:center;gap:6px;box-sizing:border-box;
  padding:6px 12px;border-radius:10px;background:var(--node);border:1.5px solid var(--c,#888);border-color:color-mix(in srgb,var(--c,#888) 70%,transparent);
  font-size:13.5px;font-weight:500;letter-spacing:.01em;line-height:1.35;color:var(--fg);
  box-shadow:0 1px 2px rgba(0,0,0,.06),0 10px 24px -12px var(--c,#888);will-change:transform}
.lbl.d1{font-size:15px;font-weight:700;padding:7px 15px;border-radius:12px;border-width:2px;border-color:var(--c,#888);background:var(--node);background:color-mix(in srgb,var(--c,#888) 12%,var(--node))}
.lbl.root{font-size:18px;font-weight:700;letter-spacing:.02em;padding:10px 24px;border-radius:999px;background:linear-gradient(135deg,var(--c),#9B5DE5);color:#fff;border-color:transparent;box-shadow:0 14px 36px -12px var(--c),inset 0 1px 0 rgba(255,255,255,.35)}
.lbl.root .badge{background:rgba(255,255,255,.28);color:#fff}
.lbl.sel{outline:3px solid var(--accent);outline-offset:2px}
.lbl.cfrom{outline:3px dashed var(--accent);outline-offset:3px}
.lbl.lift{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);box-shadow:0 6px 18px rgba(0,0,0,.25)}
input,textarea{-webkit-user-select:text;user-select:text}
#backView,#connectBar,#aiBar{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:7;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel-solid);color:var(--fg);font:700 14px/1 var(--font-ui);padding:10px 16px 10px 12px;border-radius:999px;box-shadow:var(--shadow);cursor:pointer;white-space:nowrap}
#backView:hover{background:var(--accent-soft)}
#connectBar,#aiBar{cursor:default;z-index:8;border-color:var(--accent);padding:6px 6px 6px 16px}
#connectBar button,#aiBar button{border:0;background:var(--accent-soft);color:var(--accent);font:700 13px var(--font-ui);padding:8px 12px;border-radius:999px;cursor:pointer}
#backView:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#backView svg{width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lbl .badge{font-family:var(--font-latin);font-size:11px;font-weight:600;color:var(--accent-fg);background:var(--c,#888);border-radius:999px;padding:0 6px;line-height:16px}
.lbl .t{max-width:12em;width:max-content;overflow-wrap:anywhere;line-break:strict;text-align:center}
.lkl{position:absolute;left:0;top:0;transform-origin:50% 50%;max-width:14em;white-space:normal;text-align:center;font:500 12px/1.4 var(--font-ui);color:var(--accent);background:var(--panel-solid);border:1.5px dashed var(--accent);border-radius:8px;padding:4px 10px;box-shadow:0 6px 16px -10px var(--accent);will-change:transform}
#aiExpand{color:var(--accent);font-weight:700}
@media (max-width:720px){#aiExpand .tx{display:none}}
#aiOut{margin:0;max-height:220px;overflow:auto;white-space:pre-wrap;font:12.5px/1.55 ui-monospace,"SF Mono",Menlo,monospace;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}

/* top bar */
.bar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.bar > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto;margin-right:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 10px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:420px}
.brand svg{flex:none;color:var(--accent)}
#mapsBtn{flex:none;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:0;border-radius:9px;background:transparent;color:var(--accent);cursor:pointer}
#mapsBtn:hover{background:var(--accent-soft)}
#mapsBtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sync{flex:none;display:inline-flex;align-items:center;gap:6px;font:500 12px var(--font-ui);color:var(--muted);padding:0 6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:#22C55E}
.sync.busy i{background:#F59E0B}
.sync.err i{background:var(--danger)}
@media (max-width:720px){.sync span{display:none}}
.lbl.drop{outline:3px solid var(--accent);outline-offset:4px;transform-origin:50% 50%}
#title{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:700 15px/1.2 var(--font-ui);padding:6px 4px;border-radius:6px}
#title:focus{outline:2px solid var(--accent);outline-offset:0}
.group{flex:none;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:38px;height:38px;padding:0 10px;border:0;border-radius:9px;background:transparent;color:var(--fg);font:500 13px/1 var(--font-ui);cursor:pointer}
.ib:hover{background:var(--accent-soft)}
.ib:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ib:disabled{opacity:.35;cursor:default;background:transparent}
.ib svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:720px){.bar .ib .tx{display:none}.bar .ib{padding:0 8px}}

/* menu */
#menu{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(62px + env(safe-area-inset-top,0px));min-width:220px;background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;z-index:20}
#menu button,#ctx button{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;color:var(--fg);font:500 14px/1.2 var(--font-ui);padding:10px 12px;border-radius:8px;cursor:pointer}
#menu button:hover,#menu button:focus-visible,#ctx button:hover,#ctx button:focus-visible{background:var(--accent-soft);outline:none}
#menu button svg,#ctx button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
#menu hr,#ctx hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
#home{position:absolute;inset:0;z-index:15;overflow:auto;background:radial-gradient(ellipse at 50% -10%,var(--bg2) 0%,var(--bg) 70%);padding:calc(28px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.hw{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.hhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hlogo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#4F6BFF,#9B5DE5);box-shadow:0 12px 30px -12px #4F6BFF;flex:none}
.hlogo svg{width:28px;height:28px;color:#fff}
.htitle{flex:1;min-width:0}
.htitle h1{margin:0;font:600 26px/1.15 var(--font-latin);letter-spacing:-.01em;text-wrap:balance}
.htitle p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.hacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.hact{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--panel-solid);color:var(--fg);border-radius:14px;padding:14px 16px;font:700 14.5px var(--font-ui);cursor:pointer;text-align:left}
.hact:hover{border-color:var(--accent);box-shadow:0 8px 22px -14px var(--accent)}
.hact:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hact svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--accent)}
.hact small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.hact.pri{background:linear-gradient(135deg,#4F6BFF,#7A5CF0);border-color:transparent;color:#fff}
.hact.pri svg,.hact.pri small{color:rgba(255,255,255,.85)}
.hsec{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hsec h2{margin:0;font-size:16px;font-weight:700;flex:1}
#homeSearch{min-width:0;width:min(260px,100%);font:500 14px var(--font-ui);color:var(--fg);background:var(--panel-solid);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
#homeSearch:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;background:var(--panel-solid);overflow:hidden;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(0,0,0,.35)}
.card.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card .open{display:flex;flex-direction:column;border:0;background:none;padding:0;color:var(--fg);text-align:left;cursor:pointer;font:inherit}
.card .open:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.card .pv{aspect-ratio:5/3;max-width:100%;background:radial-gradient(ellipse at 50% 45%,var(--bg2),var(--bg));display:block;width:100%}
.card .meta{padding:12px 14px 4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.card .meta b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .row2{display:flex;justify-content:flex-end;gap:2px;padding:4px 8px 8px}
.card .mini{border:0;background:transparent;color:var(--muted);font:500 12.5px var(--font-ui);padding:7px 10px;border-radius:8px;cursor:pointer}
.card .mini:hover{background:var(--accent-soft);color:var(--fg)}
.card .mini.warn{color:#fff;background:var(--danger)}
.hnote{font-size:12.5px!important}.hnote a{color:var(--accent);font-weight:700}
#homeEmpty{color:var(--muted);font-size:14px;padding:20px 0}
.hsync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);background:var(--panel-solid);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.hsync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.hsync.ok i{background:#22C55E}.hsync.busy i{background:#F59E0B}.hsync.err i{background:var(--danger)}
@media (max-width:520px){.htitle h1{font-size:22px}.hacts{grid-template-columns:1fr 1fr}.hgrid{grid-template-columns:1fr 1fr;gap:10px}.card .meta{padding:10px 10px 2px}.card .row2{padding:2px 4px 6px}}
#pasteBox{position:absolute;left:0;top:0;width:min(320px,calc(100% - 16px));background:var(--panel-solid);border:1px solid var(--accent);border-radius:14px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:8px;z-index:26}
#pbText{width:100%;box-sizing:border-box;min-height:64px;resize:vertical;font:14px/1.5 var(--font-ui);color:var(--fg);background:var(--bg);border:1px dashed var(--accent);border-radius:10px;padding:8px 10px}
#pbText:focus{outline:2px solid var(--accent);outline-offset:-1px}
.pbRow{display:flex;align-items:center;gap:6px}
.pbRow span{flex:1;font-size:12px;color:var(--muted)}
.pbRow .b{padding:8px 14px}
#ctx{position:absolute;left:0;top:0;min-width:230px;max-width:calc(100% - 16px);background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;z-index:25}

/* dock */
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(660px,calc(100% - 24px));
  background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px;display:flex;flex-direction:column;gap:8px;z-index:10}
.row{display:flex;align-items:center;gap:8px}
.row .dot{width:12px;height:12px;border-radius:50%;flex:none;margin-left:4px;background:var(--c,#888)}
#nodeLabel{flex:1;min-width:0;font:500 16px/1.3 var(--font-ui);color:var(--fg);background:var(--panel-solid);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
#nodeLabel:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.actions{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.act.on{background:var(--accent-soft);color:var(--accent)}
.links{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px 2px}
.lk{display:inline-flex;align-items:center;border:1.5px dashed var(--accent);border-radius:999px;padding:0 2px 0 4px;font-size:12.5px}
.lk button{border:0;background:transparent;color:var(--fg);font:500 12.5px var(--font-ui);padding:6px;border-radius:999px;cursor:pointer}
.lk button.x{color:var(--muted);font-size:15px;width:28px;padding:4px}
.lk button:hover{background:var(--accent-soft)}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:transparent;color:var(--fg);border-radius:10px;padding:8px 2px 7px;font:500 12px/1.1 var(--font-ui);cursor:pointer;min-height:54px;white-space:nowrap;letter-spacing:-.02em}
.act:hover{background:var(--accent-soft)}
.act:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.act:disabled{opacity:.32;cursor:default;background:transparent}
.act.primary{color:var(--accent)}
.act.danger{color:var(--danger)}
.act svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act kbd{display:none}
@media (min-width:721px) and (pointer:fine){.act kbd{display:block;font:500 10px/1 var(--font-latin);color:var(--muted)}}
.swatches{display:flex;flex-wrap:wrap;gap:8px;padding:2px 4px 4px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--panel-solid);box-shadow:0 0 0 1px var(--line);cursor:pointer;background:var(--c)}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.sw.auto{background:conic-gradient(#E4572E,#E8A33D,#3BB273,#17A2A2,#2E86AB,#7B5EA7,#D64F8C,#E4572E);position:relative}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* hint + toast */
#hint{position:absolute;z-index:6;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:min(360px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 14px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12.5px;line-height:1.7;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
#hint b{color:var(--fg);font-weight:700}
#hint ul{margin:0;padding:0;list-style:none}
#hint button{flex:none;width:28px;height:28px;border:0;background:transparent;color:var(--muted);border-radius:6px;cursor:pointer;font-size:18px;line-height:1}
#hint button:hover{background:var(--accent-soft)}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(116px + env(safe-area-inset-top,0px));background:var(--fg);color:var(--bg);border-radius:10px;padding:8px 8px 8px 14px;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow);z-index:30;max-width:calc(100% - 24px)}
#toast button{border:0;background:transparent;color:var(--accent);filter:brightness(1.4);font:700 13px var(--font-ui);padding:6px 8px;border-radius:6px;cursor:pointer}
:root[data-theme="light"] #toast button{filter:none}

/* modal */
#modal{position:absolute;inset:0;background:rgba(10,14,22,.42);display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));z-index:40}
.sheet{width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--panel-solid);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:18px;font-weight:700;text-wrap:balance}
.sheet p{margin:0;color:var(--muted);line-height:1.7;font-size:13.5px}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:500 13px var(--font-ui);padding:8px;border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--panel-solid);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.sheet textarea{width:100%;min-height:200px;resize:vertical;font:12.5px/1.55 ui-monospace,"SF Mono",Menlo,monospace;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;box-sizing:border-box}
.sheet textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.b{border:1px solid var(--line);background:var(--panel-solid);color:var(--fg);font:500 14px var(--font-ui);padding:10px 16px;border-radius:10px;cursor:pointer}
.b:hover{background:var(--accent-soft)}
.b.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.b.pri:hover{filter:brightness(1.08)}
.b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.file{font-size:13px;color:var(--muted)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;line-height:1.5}
.keys dt{font-family:var(--font-latin);font-weight:600;color:var(--fg);white-space:nowrap}
.keys dd{margin:0;color:var(--muted)}
.sheet h3{margin:6px 0 0;font-size:14px}
#err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:720px){
  #dock{bottom:calc(8px + env(safe-area-inset-bottom,0px));width:calc(100% - 16px);border-radius:14px;padding:8px}
  .act{font-size:10.5px;min-height:50px;letter-spacing:-.04em}
  .act svg{width:20px;height:20px}
  #hint{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
if (!window.THREE || !THREE.OrbitControls){
  $('#stage').innerHTML = '<div id="err">3D表示ライブラリを読み込めませんでした。ネットワークを確認して再読み込みしてください。</div>';
  return;
}

/* ---------- data ---------- */
const PALETTE = ['#FF6B6B','#4D96FF','#2EC4B6','#FFB547','#9B5DE5','#F15BB5','#00B4D8','#6BCB77'];
const ROOT_COLOR = '#4F6BFF';
const STORE = 'mindmap3d.v1';
const isTouch = matchMedia('(pointer:coarse)').matches;

const SAMPLE = `新しいアプリ企画
  ターゲット
    20〜30代の会社員
    学生・研究者
    チームで使う人
  機能
    3Dマインドマップ
    スマホ対応
    書き出し・読み込み
    テンプレート
  収益化
    フリーミアム
    チームプラン
  スケジュール
    企画 12月
    試作 1月
    公開 3月
  リスク
    操作が難しい
    競合アプリ`;

let state = null;      // {title, rootId, nodes:{id:{id,label,parent,children,pos,color,collapsed}}}
let selected = null;
const past = [], future = [];

const uid = () => Math.random().toString(36).slice(2, 10);
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

function parseOutline(text){
  const lines = text.replace(/\r/g,'').split('\n').filter(l => l.trim());
  const nodes = {}; const stack = []; const tops = [];
  for (const raw of lines){
    const m = raw.match(/^([ \t　]*)(.*)$/);
    const indent = m[1].replace(/\t/g,'  ').replace(/　/g,'  ').length;
    const label = m[2].replace(/^([-*+・•]|\d+[.)])\s*/,'').trim() || '無題';
    const id = uid();
    nodes[id] = {id,label,parent:null,children:[],pos:[0,0,0],color:null,collapsed:false};
    while (stack.length && stack[stack.length-1].indent >= indent) stack.pop();
    if (stack.length){ const p = stack[stack.length-1].id; nodes[id].parent = p; nodes[p].children.push(id); }
    else tops.push(id);
    stack.push({id,indent});
  }
  let rootId;
  if (tops.length === 1) rootId = tops[0];
  else {
    rootId = uid();
    nodes[rootId] = {id:rootId,label:'メインテーマ',parent:null,children:tops.slice(),pos:[0,0,0],color:null,collapsed:false};
    tops.forEach(t => nodes[t].parent = rootId);
  }
  return {title: nodes[rootId].label, rootId, nodes, synthetic: tops.length !== 1};
}

function toOutline(){
  const out = [];
  (function walk(id, d){ const n = state.nodes[id]; out.push('  '.repeat(d) + n.label); n.children.forEach(c => walk(c, d+1)); })(state.rootId, 0);
  return out.join('\n');
}

function validState(s){
  if (!s || typeof s !== 'object' || !s.nodes || !s.rootId || !s.nodes[s.rootId]) return false;
  for (const id in s.nodes){
    const n = s.nodes[id];
    if (!Array.isArray(n.children) || !Array.isArray(n.pos) || n.pos.length !== 3) return false;
    if (typeof n.label !== 'string') n.label = String(n.label ?? '');
  }
  return true;
}
const serialize = () => JSON.stringify(state);

/* ---------- geometry helpers ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s], len=a=>Math.hypot(a[0],a[1],a[2]);
const norm=a=>{const l=len(a)||1;return [a[0]/l,a[1]/l,a[2]/l]};
const ang=(a,b)=>Math.acos(Math.max(-1,Math.min(1,a[0]*b[0]+a[1]*b[1]+a[2]*b[2])));
const FIB = (() => { const N=320, out=[], g=Math.PI*(3-Math.sqrt(5));
  for (let i=0;i<N;i++){ const y=1-(i/(N-1))*2, r=Math.sqrt(1-y*y), t=g*i; out.push([Math.cos(t)*r,y,Math.sin(t)*r]); } return out; })();

function depthOf(id){ let d=0, n=state.nodes[id]; while(n && n.parent){ d++; n=state.nodes[n.parent]; } return d; }

function choosePos(pid, siblingIds, P, cid){
  const p = P[pid], node = state.nodes[pid];
  const dirs = []; let base = null;
  if (node.parent){ const toG = norm(sub(P[node.parent], p)); dirs.push(toG); base = mul(toG,-1); }
  for (const s of siblingIds) if (P[s]) dirs.push(norm(sub(P[s], p)));
  let best = FIB[0], bs = -1e9;
  for (const c of FIB){
    let dev = 0;
    if (base){ dev = ang(c, base); if (dev > 1.3) continue; }
    let m = Math.PI; for (const d of dirs){ const a = ang(c,d); if (a < m) m = a; }
    const sc = m - (base ? 0.45*dev : 0.4*Math.abs(c[1]));
    if (sc > bs){ bs = sc; best = c; }
  }
  const d = depthOf(pid) + 1;
  const n = node.children.length;
  let L = d === 1 ? 4.2 : Math.max(2.2, 3.4*Math.pow(0.85, d-2));
  L *= 1 + 0.08*Math.max(0, n-4);
  if (cid) L += (boxSize(pid)[0] + boxSize(cid)[0])*0.3;
  return add(p, mul(best, L));
}

const UNIT = 0.022;   // world units per CSS pixel at label scale 1
function boxSize(id){
  const n = state.nodes[id], d = depthOf(id);
  const fs = d === 0 ? 18 : d === 1 ? 15 : 13.5;
  const pad = d === 0 ? 40 : d === 1 ? 30 : 26;
  let w = 0; for (const ch of (n.label || '無題')) w += ch.charCodeAt(0) > 0x2E80 ? fs : fs*0.6;
  const lines = Math.max(1, Math.ceil(w / (fs*12)));   // long text wraps at 12em
  w = Math.min(w, fs*12);
  if (n.collapsed && n.children.length) w += 34;
  const h = fs*1.35*lines + (d === 0 ? 22 : d === 1 ? 16 : 14);
  return [(w + pad)*UNIT, h*UNIT];
}
function cumOff(id){ let o = [0,0,0], n = state.nodes[id]; while (n){ if (n.off) o = add(o, n.off); n = n.parent ? state.nodes[n.parent] : null; } return o; }
function computeLayout(){
  const B = {}, rid = state.rootId, q = [rid];
  B[rid] = [0,0,0];
  while (q.length){
    const id = q.shift(), n = state.nodes[id], placed = [];
    if (n.collapsed){ for (const d of descendants(id)) if (d !== id) B[d] = B[id].slice(); continue; }
    for (const c of n.children){ B[c] = choosePos(id, placed, B, c); placed.push(c); q.push(c); }
  }
  relax(B);
  const P = {}; for (const id in B) P[id] = add(B[id], cumOff(id));
  return P;
}
// push apart framed nodes that sit too close, so boxes don't pile up as a map grows
function relax(B){
  const ids = Object.keys(B).filter(isVisible), rid = state.rootId, n = ids.length;
  if (n < 3) return;
  const rad = {}, home = {};
  for (const id of ids){ const [w, h] = boxSize(id); rad[id] = Math.max(w*0.5, h*0.9)*0.95 + 0.25; home[id] = B[id].slice(); }
  const iters = n > 400 ? 6 : n > 150 ? 14 : 28;
  for (let it = 0; it < iters; it++){
    let moved = 0;
    for (let i = 0; i < n; i++){
      const a = ids[i], pa = B[a];
      for (let j = i + 1; j < n; j++){
        const b = ids[j], pb = B[b];
        const dx = pb[0]-pa[0], dy = pb[1]-pa[1], dz = pb[2]-pa[2];
        const need = rad[a] + rad[b], d2 = dx*dx + dy*dy + dz*dz;

        const wa = a === rid ? 0 : (b === rid ? 2 : 1), wb = b === rid ? 0 : (a === rid ? 2 : 1);

        pb[0] += ux*push*wb; pb[1] += uy*push*wb; pb[2] += uz*push*wb;
        moved++;
      }
    }
    for (const id of ids){ if (id === rid) continue; const p = B[id], h = home[id]; for (let k = 0; k < 3; k++) p[k] += (h[k] - p[k])*0.04; }
    if (!moved) break;
  }

}

function startDrag(d, e){

/* ---------- tapered tubes ---------- */
function tubeInto(pos, idx, curve, seg, r0, r1, radial){
  const frames = curve.computeFrenetFrames(seg, false), P = new THREE.Vector3(), base = pos.length/3;
  for (let i = 0; i <= seg; i++){
    const t = i/seg; curve.getPointAt(t, P);
    const r = r0 + (r1 - r0)*t, n = frames.normals[i], bn = frames.binormals[i];
    for (let j = 0; j < radial; j++){
      const v = j/radial*Math.PI*2, c = Math.cos(v), sn = Math.sin(v);
      pos.push(P.x + r*(c*n.x + sn*bn.x), P.y + r*(c*n.y + sn*bn.y), P.z + r*(c*n.z + sn*bn.z));
    }
  }
  for (let i = 0; i < seg; i++) for (let j = 0; j < radial; j++){
    const q = base + i*radial, a = q + j, b2 = q + radial + j, c = q + radial + (j+1)%radial, d = q + (j+1)%radial;
    idx.push(a, b2, d, b2, c, d);
  }
}
function makeGeo(pos, idx){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function taperTube(curve, seg, r0, r1, radial){ const pos = [], idx = []; tubeInto(pos, idx, curve, seg, r0, r1, radial); return makeGeo(pos, idx); }

const linkEls = new Map(), linkMid = new Map();
function syncLinkLabels(shown){
  for (const [id, el] of linkEls){ const l = (state.links || []).find(x => x.id === id); if (!l || !l.note || !shown.has(id)){ el.remove(); linkEls.delete(id); } }
  for (const l of state.links || []){
    if (!l.note || !shown.has(l.id)) continue;
    let el = linkEls.get(l.id);
    if (!el){ el = document.createElement('div'); el.className = 'lkl'; labelsEl.appendChild(el); linkEls.set(l.id, el); }
    if (el.textContent !== l.note) el.textContent = l.note;
  }
}
const linkMat = new THREE.MeshBasicMaterial({color:0x3B57D9, transparent:true, opacity:.8, side:THREE.DoubleSide});
let linkMesh = null;
function rebuildLinks(){
  if (linkMesh){ scene.remove(linkMesh); linkMesh.geometry.dispose(); linkMesh = null; }
  const pos = [], idx = [], shown = new Set();
  for (const l of state.links || []){
    const A = state.nodes[l.a], B = state.nodes[l.b];
    if (!A || !B || !isVisible(l.a) || !isVisible(l.b)) continue;
    const a = new THREE.Vector3(...A.pos), b = new THREE.Vector3(...B.pos), L = a.distanceTo(b);
    if (L < 1e-3) continue;
    const mid = a.clone().lerp(b, .5).add(new THREE.Vector3(0, L*0.12, L*0.42));
    const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
    if (l.id){ linkMid.set(l.id, curve.getPoint(0.5)); shown.add(l.id); }
    const n = Math.max(6, Math.round(curve.getLength()/0.42));
    for (let i = 0; i < n; i++){
      const t0 = i/n, t1 = (i + 0.58)/n, pts = [];
      for (let k = 0; k <= 3; k++) pts.push(curve.getPointAt(t0 + (t1 - t0)*k/3));
      tubeInto(pos, idx, new THREE.CatmullRomCurve3(pts), 3, .04, .04, 6);
    }
  }
  syncLinkLabels(shown);
  if (pos.length){ linkMesh = new THREE.Mesh(makeGeo(pos, idx), linkMat); scene.add(linkMesh); }
}

/* ---------- scene objects ---------- */
const objs = new Map();
function makeObj(id){
  const mesh = new THREE.Object3D();   // holds the node's position
  const el = document.createElement('div'); el.className = 'lbl';
  const t = document.createElement('span'); t.className = 't';
  const badge = document.createElement('span'); badge.className = 'badge';
  el.append(t, badge); labelsEl.appendChild(el);
  const o = {mesh, edge:null, el, t, badge};
  objs.set(id, o);
  return o;
}
function placeMesh(id){
  const o = objs.get(id), n = state.nodes[id]; if (!o) return;
  o.mesh.position.set(n.pos[0], n.pos[1], n.pos[2]);
}
function rebuildEdge(id){
  const o = objs.get(id), n = state.nodes[id]; if (!o) return;
  if (o.edge){ scene.remove(o.edge); o.edge.geometry.dispose(); o.edge.material.dispose(); o.edge = null; }
  if (!n.parent) return;
  const p = state.nodes[n.parent];
  const a = new THREE.Vector3(...p.pos), b = new THREE.Vector3(...n.pos);
  const L = a.distanceTo(b); if (L < 1e-3) return;
  const ab = b.clone().sub(a).normalize();
  let outA = ab.clone();
  if (p.parent){ outA = a.clone().sub(new THREE.Vector3(...state.nodes[p.parent].pos)).normalize().lerp(ab, .45).normalize(); }
  const c1 = a.clone().addScaledVector(outA, L*.42), c2 = b.clone().addScaledVector(ab, -L*.32);
  const curve = new THREE.CubicBezierCurve3(a, c1, c2, b);
  const d = depthOf(id);
  const r0 = d === 1 ? .14 : d === 2 ? .065 : .04, r1 = d === 1 ? .05 : d === 2 ? .035 : .024;
  const geo = taperTube(curve, 30, r0, r1, 10);
  const col = branchColor(id);
  const mat = new THREE.MeshStandardMaterial({color:col, emissive:col, emissiveIntensity:.2, roughness:.3, metalness:.15, side:THREE.DoubleSide});
  o.edge = new THREE.Mesh(geo, mat); scene.add(o.edge);
  o.edge.visible = o.vis !== false;
}
function refreshObj(id){
  const o = objs.get(id), n = state.nodes[id];
  const col = branchColor(id);
  if (o.edge){ o.edge.material.color.set(col); o.edge.material.emissive.set(col); }
  o.el.style.setProperty('--c', col);
  o.el.classList.toggle('root', !n.parent);
  o.el.classList.toggle('d1', n.parent === state.rootId);
  o.el.classList.toggle('cfrom', id === connectFrom);
  o.el.classList.toggle('sel', id === selected);
  o.t.textContent = n.label || '無題';
  const hidden = n.collapsed ? descendants(id).length - 1 : 0;
  o.badge.textContent = hidden ? '+' + hidden : '';
  o.badge.hidden = !hidden;
}
function refreshAll(){
  for (const id of objs.keys()){
    refreshObj(id);
    const v = isVisible(id), o = objs.get(id);
    if (o.edge) o.edge.visible = v; o.el.hidden = !v; o.vis = v;
  }
  rebuildLinks();
}
function syncAll(){
  for (const [id, o] of objs){
    if (o.edge){ scene.remove(o.edge); o.edge.geometry.dispose(); o.edge.material.dispose(); }
    o.el.remove();
  }
  objs.clear();
  if (connectFrom && !state.nodes[connectFrom]) endConnect();
  for (const id in state.nodes){ makeObj(id); placeMesh(id); }
  for (const id in state.nodes) rebuildEdge(id);
  if (selected && !state.nodes[selected]) selected = null;
  refreshAll(); updateDock(); updateHistoryBtns();
  $('#title').value = state.title || '';
}

/* ---------- picking ---------- */
function pick(cx, cy, exclude){
  const r = cvs.getBoundingClientRect(), x = cx - r.left, y = cy - r.top;
  let best = null, bestD = Infinity, near = null, nearD = Infinity;
  for (const [id, o] of objs){
    if (!o.vis || o.sx === undefined || o.behind || (exclude && exclude.has(id))) continue;
    const b2 = o.el.getBoundingClientRect();
    if (cx >= b2.left-3 && cx <= b2.right+3 && cy >= b2.top-3 && cy <= b2.bottom+3){ if (o.dist < bestD){ bestD = o.dist; best = id; } continue; }
    const dd = Math.hypot(x - o.sx, y - o.sy);
    if (dd < (isTouch ? 22 : 12) && dd < nearD){ nearD = dd; near = id; }
  }
  if (best || near) return best || near;
  for (const [lid, el] of linkEls){
    if (el.style.visibility === 'hidden') continue;
    const r2 = el.getBoundingClientRect();
    if (cx >= r2.left-3 && cx <= r2.right+3 && cy >= r2.top-3 && cy <= r2.bottom+3) return 'L:' + lid;
  }
  return null;
}
const isLink = id => typeof id === 'string' && id.startsWith('L:');

/* ---------- labels ---------- */
const pv = new THREE.Vector3();
function updateLabels(){
  const w = stage.clientWidth, h = stage.clientHeight;
  if (w < 2 || h < 2) return;
  const k = h / (2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2));
  const td = Math.max(2, camera.position.distanceTo(controls.target));
  scene.fog.near = td*0.75; scene.fog.far = td*2.6;
  for (const [id, o] of objs){
    if (!o.vis) continue;
    pv.copy(o.mesh.position);
    const dist = camera.position.distanceTo(pv);
    pv.project(camera);
    if (pv.z > 1 || pv.z < -1){ o.behind = true; o.el.style.visibility = 'hidden'; continue; }
    o.behind = false; o.el.style.visibility = '';
    const sx = (pv.x+1)/2*w, sy = (1-pv.y)/2*h;
    o.sx = sx; o.sy = sy; o.dist = dist;
    const rel = (dist - td) / td;
    const s = Math.max(.2, Math.min(2.2, k/dist*UNIT));
    const op = id === selected ? 1 : Math.max(.45, Math.min(1, 1.15 - rel*.8));
    o.el.style.transform = `translate3d(${sx.toFixed(1)}px,${sy.toFixed(1)}px,0) translate(-50%,-50%) scale(${s.toFixed(3)})`;
    o.el.style.opacity = op.toFixed(2);
    o.el.style.zIndex = id === selected ? 100000 : String(Math.round(50000 - dist*100));
  }
  for (const [lid, el] of linkEls){
    const m = linkMid.get(lid); if (!m) continue;
    pv.copy(m); const dist = camera.position.distanceTo(pv); pv.project(camera);
    if (pv.z > 1 || pv.z < -1){ el.style.visibility = 'hidden'; continue; }
    el.style.visibility = '';
    const s = Math.max(.25, Math.min(1.8, k/dist*UNIT));
    el.style.transform = `translate3d(${((pv.x+1)/2*w).toFixed(1)}px,${((1-pv.y)/2*h).toFixed(1)}px,0) translate(-50%,-50%) scale(${s.toFixed(3)})`;
    el.style.zIndex = String(Math.round(50000 - dist*100));
  }
}

/* ---------- animation ---------- */
let camAnim = null, layoutAnim = null, savedView = null;
function clearSaved(){ savedView = null; $('#backView').hidden = true; }
function backView(){ if (!savedView) return fitAll(); const v = savedView; animateCamera(v.t, v.p); clearSaved(); }
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function animateCamera(target, position, dur=650){
  camAnim = {t0:performance.now(), dur, ft:controls.target.clone(), fp:camera.position.clone(), tt:target, tp:position};
}
function stepCam(now){
  const a = camAnim, t = Math.min(1, (now-a.t0)/a.dur), e = ease(t);
  controls.target.lerpVectors(a.ft, a.tt, e); camera.position.lerpVectors(a.fp, a.tp, e);
  if (t >= 1) camAnim = null;
}
function stepLayout(now){
  const a = layoutAnim, t = Math.min(1, (now-a.t0)/a.dur), e = ease(t);
  for (const id in a.to){
    const f = a.from[id] || a.to[id], g = a.to[id];

      if (!m){ await ref.delete(); delete lastSynced[id]; continue; }
      lastSynced[id] = m.json;
      await ref.set({title: m.title, updated: m.updated, count: m.count || countOf(m.json), json: m.json});
    }

  } catch(e){
    setSync('err', e && e.code === 'quota_exceeded' ? 'クラウドの容量がいっぱいです' : 'クラウドに保存できませんでした（この端末には保存済み）');

function applyRemote(json){

  const sel = selected;
  state = s; fixLinks();

function openMap(id, quiet){

  if (!validState(s)){ s = parseOutline('メインテーマ'); s.title = maps[id].title; }
  lastSynced[id] = maps[id].json;

}

async function startCloud(){
  let db = null, user = null;
  try { [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch(e){}
  const uid = user ? await user.id() : null;
  if (!db || !uid){ setSync('local'); return; }
  cloud = {db, col: db.collection('data/users/' + uid)};
  setSync('wait');
  const slow = setTimeout(() => { if (!cloudReady) setSync('err', 'クラウドにつながりません。この端末には保存しています'); }, 10000);
  cloud.col.onSnapshot(snap => {
    if (snap.metadata.fromCache && !cloudReady) return;
    const first = !cloudReady;
    if (first){ cloudReady = true; clearTimeout(slow); }
    const remote = {};
    for (const d of snap.docs){ const v = d.data(); if (v && typeof v.json === 'string') remote[d.id] = v; }
    if (first){
      // a sample this device made on its own first launch gives way to the maps already in the cloud
      if (Object.keys(remote).length){
        for (const id in maps) if (maps[id].auto && !remote[id]) delete maps[id];
      }
      // merge: whichever copy of each map is newer wins; local-only maps are uploaded
      for (const id in maps){ if (!remote[id] || (maps[id].updated || 0) > (remote[id].updated || 0)) pendingCloud.add(id); }
      for (const id in remote){ if (!maps[id] || (remote[id].updated || 0) > (maps[id].updated || 0)) maps[id] = {title: remote[id].title, updated: remote[id].updated, json: remote[id].json, count: remote[id].count}; lastSynced[id] = remote[id].json; }
      saveLocalMaps();
      if (!maps[curId]){ const rest = Object.keys(maps).sort((a, b) => (maps[b].updated || 0) - (maps[a].updated || 0)); if (rest.length){ curId = null; openMap(rest[0], true); } }
      else if (maps[curId].json !== serialize()) applyRemote(maps[curId].json);
      if (pendingCloud.size) flushCloud(); else setSync('ok');
    } else {
      for (const ch of snap.docChanges()){
        const id = ch.doc.id;
        if (ch.type === 'removed'){
          if (pendingCloud.has(id)) continue;
          delete maps[id]; delete lastSynced[id];
          if (id === curId){ const rest = Object.keys(maps).sort((a, b) => maps[b].updated - maps[a].updated); if (rest.length) openMap(rest[0], true); }
          continue;
        }
        const v = remote[id]; if (!v || v.json === lastSynced[id]) continue;
        if (ch.doc.metadata.hasPendingWrites) continue;
        lastSynced[id] = v.json;
        if (id === curId){
          if (localBusy()) continue;            // our own newer edit wins (last writer wins)
          maps[id] = {title: v.title, updated: v.updated, json: v.json, count: v.count};
          applyRemote(v.json);
          $('#title').value = state.title || '';
        } else maps[id] = {title: v.title, updated: v.updated, json: v.json, count: v.count};
      }
      saveLocalMaps();
    }
    if (homeShown()) renderHome();
  }, err => { clearTimeout(slow); setSync('err', 'クラウドとの接続が切れました。この端末には保存しています'); });
}

function fmtTime(t){
  if (!t) return '';
  const d = new Date(t), now = new Date();
  const hm = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  return d.toDateString() === now.toDateString() ? '今日 ' + hm : (d.getMonth()+1) + '/' + d.getDate() + ' ' + hm;
}
// a small front view of a map's shape, drawn from its saved positions
function previewSVG(json){
  let st; try { st = JSON.parse(json); } catch(e){ return ''; }
  if (!st || !st.nodes || !st.nodes[st.rootId]) return '';
  const N = st.nodes, rid = st.rootId, kids = N[rid].children || [];
  const vis = id => { let n = N[id]; while (n && n.parent){ n = N[n.parent]; if (!n || n.collapsed) return false; } return true; };
  const col = id => { let n = N[id]; while (n){ if (n.color) return n.color; if (n.parent === rid){ const i = kids.indexOf(n.id); return PALETTE[(i < 0 ? 0 : i) % PALETTE.length]; } if (!n.parent) return ROOT_COLOR; n = N[n.parent]; } return ROOT_COLOR; };
  const ids = Object.keys(N).filter(id => vis(id) && Array.isArray(N[id].pos));
  if (!ids.length) return '';
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const id of ids){ const [x, y] = N[id].pos; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const W = 250, H = 150, pad = 16, sc = Math.min((W - 2*pad)/Math.max(x1 - x0, 1e-3), (H - 2*pad)/Math.max(y1 - y0, 1e-3), 40);
  const cx = (x0 + x1)/2, cy = (y0 + y1)/2;
  const P = id => [W/2 + (N[id].pos[0] - cx)*sc, H/2 - (N[id].pos[1] - cy)*sc];
  const depth = id => { let d = 0, n = N[id]; while (n && n.parent){ d++; n = N[n.parent]; } return d; };
  let lines = '', dots = '';
  for (const id of ids){
    const [x, y] = P(id), d = depth(id), c = col(id);
    if (N[id].parent && N[N[id].parent]){ const [px, py] = P(N[id].parent); lines += `<line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${c}" stroke-width="${d === 1 ? 2.6 : d === 2 ? 1.6 : 1.1}" stroke-linecap="round" opacity=".85"/>`; }
    dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${d === 0 ? 7 : d === 1 ? 4.2 : 2.6}" fill="${c}"/>`;
  }
  return `<svg class="pv" viewBox="0 0 ${W} ${H}" aria-hidden="true">${lines}${dots}</svg>`;
}

window.addEventListener('keydown', e => {
  const tag = (e.target.tagName||'').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea';
  const mod = e.ctrlKey || e.metaKey;
  if (!$('#modal').hidden){ if (e.key === 'Escape') closeModal(); return; }
  if (homeShown()) return;
  if (mod && (e.key === 'z' || e.key === 'Z')){ if (typing && !e.shiftKey && tag==='textarea') return; e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && (e.key === 'y' || e.key === 'Y')){ e.preventDefault(); redo(); return; }
  if (typing) return;
  if (e.key === 'Escape'){ closeMenu(); if (!$('#ctx').hidden){ hideCtx(); return; } if (connectFrom){ endConnect(); return; } if (selected) select(null); else if (savedView) backView(); return; }
  if (mod || e.altKey) return;
  if (e.key === 'l' || e.key === 'L'){ e.preventDefault(); relayout(); return; }
  if (e.key === '0'){ e.preventDefault(); fitAll(); return; }
  if (!selected){
    if (e.key === 'Tab' || e.key === 'Enter'){ e.preventDefault(); select(state.rootId); }
    return;
  }
  switch (e.key){
    case 'Tab': e.preventDefault(); addChild(); break;
    case 'Enter': e.preventDefault(); addSibling(); break;
    case 'Delete': case 'Backspace': e.preventDefault(); removeNode(); break;
    case 'F2': e.preventDefault(); editLabel(false); break;
    case ' ': e.preventDefault(); toggleFold(); break;
    case 'f': case 'F': e.preventDefault(); focusNode(selected); break;
    case 'c': case 'C': e.preventDefault(); $('#aColor').click(); break;
    case 'k': case 'K': e.preventDefault(); startConnect(); break;
    case 'ArrowUp': e.preventDefault(); if (state.nodes[selected].parent) select(state.nodes[selected].parent); break;
    case 'ArrowDown': { e.preventDefault(); const n = state.nodes[selected]; if (n.children.length && !n.collapsed) select(n.children[0]); break; }
    case 'ArrowLeft': case 'ArrowRight': {
      e.preventDefault(); const n = state.nodes[selected]; if (!n.parent) break;
      const sib = state.nodes[n.parent].children, i = sib.indexOf(selected);
      select(sib[(i + (e.key==='ArrowRight'?1:-1) + sib.length) % sib.length]); break; }
  }
});

/* ---------- markdown ---------- */
function cleanInline(t){
  return t.replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/\[\[([^\]|]+)(?:\|([^\]]*))?\]\]/g, (m, a, b) => b || a)
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/(\*\*|__)(.+?)\1/g, '$2')
    .replace(/\*(\S(?:.*?\S)?)\*/g, '$1')
    .replace(/(^|[^\w])_(\S(?:.*?\S)?)_(?=[^\w]|$)/g, '$1$2')
    .replace(/~~(.+?)~~/g, '$1').replace(/==(.+?)==/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/<[^>]+>/g, '').replace(/\s+#+\s*$/, '').trim();
}
function looksLikeMarkdown(t){ return /^(#{1,6}\s|\s*([-*+•・]|\d+[.)])\s)/m.test(t); }
// Bullets copied from some apps lose their line breaks but keep the indent spaces:
// "- A   - B     - C" -> "- A\n  - B\n    - C" (the space that replaced each line break is dropped)
function unflatten(t){
  t = String(t).replace(/ |　/g, ' ').replace(/\r/g, '');
  return t.split('\n').map(line => {
    if (!/^\s*[-*+•・]\s/.test(line)) return line;
    const marks = line.match(/(^|\s)[-*+•・](?=\s)/g);
    if (!marks || marks.length < 2) return line;
    return line.replace(/ ( *)([-*+•・])(?=\s|$)/g, '\n$1$2');
  }).join('\n');
}
function parseMarkdown(text, name){
  let lines = text.replace(/\r/g, '').split('\n');
  if (lines[0] && lines[0].trim() === '---'){
    const end = lines.findIndex((l, i) => i > 0 && l.trim() === '---');
    if (end > 0) lines = lines.slice(end + 1);
  }
  const items = []; let inCode = false, head = 0, indents = [];
  for (const raw of lines){
    if (/^\s*(```|~~~)/.test(raw)){ inCode = !inCode; continue; }
    if (inCode) continue;
    const line = raw.replace(/\t/g, '    ');
    let m;
    if ((m = line.match(/^ {0,3}(#{1,6})\s+(.*)$/))){
      head = m[1].length; indents = [];
      const label = cleanInline(m[2]); if (label) items.push({level: head*10, label});
      continue;
    }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) continue;
    if ((m = line.match(/^(\s*)(?:[-*+•・]|\d+[.)])\s+(.*)$/))){
      const ind = m[1].length;
      while (indents.length && indents[indents.length-1] > ind) indents.pop();
      if (!indents.length || indents[indents.length-1] < ind) indents.push(ind);
      const label = cleanInline(m[2].replace(/^\[ \]\s*/, '☐ ').replace(/^\[[xX]\]\s*/, '☑ '));
      if (label) items.push({level: head*10 + Math.min(indents.length, 9), label});
    }
  }
  if (!items.length) return null;
  const nodes = {}, stack = [], tops = [];
  for (const it of items){
    const id = uid();
    nodes[id] = {id, label: it.label.slice(0, 80), parent: null, children: [], pos: [0,0,0], color: null, collapsed: false};
    while (stack.length && stack[stack.length-1].level >= it.level) stack.pop();
    if (stack.length){ const pid = stack[stack.length-1].id; nodes[id].parent = pid; nodes[pid].children.push(id); }
    else tops.push(id);
    stack.push({id, level: it.level});
  }
  const base = (name || '').replace(/\.(md|markdown|txt)$/i, '').trim();
  let rootId;
  if (tops.length === 1) rootId = tops[0];
  else {
    rootId = uid();
    nodes[rootId] = {id: rootId, label: base || 'メインテーマ', parent: null, children: tops.slice(), pos: [0,0,0], color: null, collapsed: false};
    tops.forEach(t => nodes[t].parent = rootId);
  }
  return {title: tops.length === 1 ? nodes[rootId].label : (base || nodes[rootId].label), rootId, nodes, synthetic: tops.length !== 1};
}
function toMarkdown(){
  const r = state.nodes[state.rootId], out = ['# ' + r.label, ''];
  (function walk(id, d){ for (const c of state.nodes[id].children){ out.push('  '.repeat(d) + '- ' + state.nodes[c].label); walk(c, d+1); } })(state.rootId, 0);
  return out.join('\n') + '\n';
}
function importText(raw, name, asNew){
  const txt = String(raw || '').replace(/^﻿/, '').trim();
  if (!txt){ toast('中身が空です'); return false; }
  let next = null, layout = true;
  if (txt[0] === '{'){
    try { const j = JSON.parse(txt); if (validState(j)) next = j; } catch(e){}
    if (!next){ toast('JSONの形式が正しくありません'); return false; }
    layout = false;
  } else next = parseAny(txt, name);
  if (!next || !Object.keys(next.nodes).length){ toast('見出しや箇条書きが見つかりませんでした'); return false; }
  if (layout && Object.keys(next.nodes).length > 120){
    for (const id in next.nodes){
      let d = 0, n = next.nodes[id]; while (n.parent){ d++; n = next.nodes[n.parent]; }
      if (d >= 2 && next.nodes[id].children.length) next.nodes[id].collapsed = true;
    }
  }
  delete next.synthetic;
  if (asNew){ hideHome(); createMap(next, layout, (name ? `「${name}」を` : '') + '新しいマップとして開きました'); swoop(); return true; }
  commit(); loadState(next, layout);
  toast((name ? `「${name}」を` : '') + '読み込みました', true);
  return true;
}
function readFileIn(f){
  if (!f) return;
  const r = new FileReader();
  r.onload = () => importText(r.result, f.name, true);
  r.onerror = () => toast('ファイルを読み込めませんでした');
  r.readAsText(f);
}
$('#mOpen').onclick = () => { closeMenu(); const i = $('#openFile'); i.value = ''; i.click(); };
$('#openFile').onchange = e => readFileIn(e.target.files[0]);
window.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
window.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f){ e.preventDefault(); readFileIn(f); } });


/* ---------- paste ---------- */
function parseAny(txt, name){
  txt = unflatten(txt);
  return (/\.(md|markdown)$/i.test(name || '') || looksLikeMarkdown(txt)) ? parseMarkdown(txt, name) : parseOutline(txt);
}
function worldAt(x, y){
  const pl = new THREE.Plane().setFromNormalAndCoplanarPoint(camera.getWorldDirection(new THREE.Vector3()), controls.target);
  raycaster.setFromCamera(ndc(x, y), camera);
  const hit = raycaster.ray.intersectPlane(pl, new THREE.Vector3());
  return hit ? [hit.x, hit.y, hit.z] : null;
}
// nudge new top-level items so the first one lands on `at`, keeping their shape
function placeAt(ids, at){
  if (!at || !ids.length) return;
  const L = computeLayout(), first = L[ids[0]]; if (!first) return;
  const d = sub(at, first);
  for (const id of ids) state.nodes[id].off = add(state.nodes[id].off || [0,0,0], d);
}
function graftText(raw, targetId, at){
  const txt = String(raw || '').replace(/^﻿/, '').trim();
  if (!txt){ toast('中身が空です'); return false; }
  if (txt[0] === '{') return importText(txt, '');
  const g = parseAny(txt, '');
  if (!g || !Object.keys(g.nodes).length){ toast('ノードにできる行が見つかりませんでした'); return false; }
  commit();
  const target = state.nodes[targetId] || state.nodes[state.rootId];
  const tops = g.synthetic ? g.nodes[g.rootId].children.slice() : [g.rootId];
  if (g.synthetic) delete g.nodes[g.rootId];
  for (const id in g.nodes) state.nodes[id] = g.nodes[id];
  target.collapsed = false;
  for (const id in g.nodes) state.nodes[id].pos = target.pos.slice();
  for (const t of tops){ state.nodes[t].parent = target.id; target.children.push(t); }
  syncAll(); select(tops[0]); placeAt(tops, at); animateLayout(); save();
  setTimeout(() => ensureInView(tops[0]), 460);
  toast(`${Object.keys(g.nodes).length}個のノードを「${trim(target.label)}」の下に追加しました`, true);
  return true;
}
document.addEventListener('paste', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || !$('#modal').hidden) return;
  const cd = e.clipboardData; if (!cd) return;
  const t = cd.getData('text/plain');
  if ((!t || !t.trim()) && cd.files && cd.files[0]){ e.preventDefault(); readFileIn(cd.files[0]); return; }
  if (!t || !t.trim()) return;
  e.preventDefault();
  if (homeShown()){ importText(t, '', true); return; }
  graftText(t, selected || state.rootId);
});

let pbTarget = null, pbAt = null;
function openPasteBox(target, pt, at){
  pbTarget = target; pbAt = at;
  const box = $('#pasteBox'), ta = $('#pbText');
  ta.value = '';
  $('#pbHint').textContent = isTouch ? '上の欄を長押し→「ペースト」' : 'Ctrl+V（Macは⌘V）で貼り付け';
  box.hidden = false;
  const w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.max(8, Math.min(pt.x - w/2, innerWidth - w - 8)) + 'px';
  box.style.top = Math.max(8, Math.min(pt.y - 20, innerHeight - h - 8)) + 'px';
  setTimeout(() => ta.focus({preventScroll:true}), 30);
}
function closePasteBox(){ $('#pasteBox').hidden = true; if (document.activeElement === $('#pbText')) $('#pbText').blur(); }
function pasteBoxSubmit(text){
  if (!text || !text.trim()){ $('#pbText').focus(); return; }
  closePasteBox();
  graftText(text, state.nodes[pbTarget] ? pbTarget : state.rootId, pbAt);
}
$('#pbText').addEventListener('paste', e => {
  const t = e.clipboardData && e.clipboardData.getData('text/plain');
  if (t && t.trim()){ e.preventDefault(); pasteBoxSubmit(t); }
});
$('#pbText').addEventListener('keydown', e => {
  if (e.key === 'Escape'){ e.preventDefault(); closePasteBox(); }
  else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); pasteBoxSubmit($('#pbText').value); }
});
$('#pbAdd').onclick = () => pasteBoxSubmit($('#pbText').value);
$('#pbClose').onclick = closePasteBox;

$('#cPaste').onclick = () => {
  const target = ctxTarget, pt = ctxPoint, at = pt ? worldAt(pt.x, pt.y) : null;
  hideCtx();
  let done = false;
  const fallback = () => { if (!done){ done = true; if (pt) openPasteBox(target, pt, at); else openPaste(target); } };
  try {
    if (navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(t => {
        if (done) return; done = true;
        if (t && t.trim()) graftText(t, target, at); else if (pt) openPasteBox(target, pt, at); else openPaste(target);
      }, fallback);
      setTimeout(fallback, 1200);
      return;
    }
  } catch(e){}
  fallback();
};
$('#cAdd').onclick = () => {
  const t = ctxTarget, at = ctxPoint ? worldAt(ctxPoint.x, ctxPoint.y) : null;
  hideCtx(); select(t); addChild(t);
  if (at && selected && selected !== t){ placeAt([selected], at); animateLayout(); }
};
$('#cFit').onclick = () => { hideCtx(); fitAll(); };
$('#cLayout').onclick = () => { hideCtx(); relayout(); };

/* ---------- AI: make a whole map, or grow one node ---------- */
let sampleFn = null, aiCtl = null;
function setAI(on){ for (const sel of ['#mAI', '#cAI', '#aiExpand', '#hAI']) $(sel).hidden = !on; }
(async () => { try { sampleFn = await claude.use('sample'); } catch(e){ sampleFn = null; } setAI(!!sampleFn); })();
function aiErr(code){
  if (code === 'cancelled') return '';
  if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(code)){ setAI(false); return 'この画面ではAIでの作成を使えません'; }
  if (code === 'rate_limited') return 'AIの利用が混み合っています。少し待ってからもう一度お試しください';
  if (code === 'refused') return 'この内容では作成できませんでした。書き方を変えてみてください';
  if (code === 'session_expired') return 'もう一度ログインしてから試してください';
  if (code === 'prompt_too_large') return '文章が長すぎます。短くしてから試してください';
  return 'うまく作成できませんでした。もう一度お試しください';
}
function showAIBar(msg){ $('#aiBarTx').textContent = msg; $('#aiBar').hidden = false; $('#backView').hidden = true; }
function hideAIBar(){ $('#aiBar').hidden = true; $('#backView').hidden = !savedView; }
$('#aiStop').onclick = () => { if (aiCtl) aiCtl.abort(); };
const stripFence = t => t.replace(/```[a-zA-Z]*\n?/g, '');
function splitLinks(text){
  const t = stripFence(text), i = t.indexOf('%%');
  return i < 0 ? [t, ''] : [t.slice(0, i), t.slice(i)];
}
function parseAILinks(part, st){
  const byLabel = {};
  for (const id in st.nodes) byLabel[st.nodes[id].label.replace(/\s+/g, '')] = id;
  const out = [];
  for (const line of part.split('\n')){
    const m = line.match(/^\s*[-*]?\s*(.+?)\s*(?:<->|↔)\s*(.+?)\s*[:：]\s*(.+)$/);
    if (!m) continue;
    const a = byLabel[cleanInline(m[1]).replace(/\s+/g, '')], b = byLabel[cleanInline(m[2]).replace(/\s+/g, '')];
    if (a && b && a !== b) out.push({id: uid(), a, b, note: cleanInline(m[3]).slice(0, 80)});
    if (out.length >= 3) break;
  }
  return out;
}
const SIZES = {s: ['小さめ', 'およそ12〜18個', '3〜4本'], m: ['ふつう', 'およそ25〜35個', '4〜6本'], l: ['大きめ', 'およそ45〜60個', '5〜7本']};
function genPrompt(topic, size){
  const [, total, branches] = SIZES[size];
  return `次のテーマや内容から、日本語のマインドマップを作ってください。

テーマ・内容:
-----
${topic.slice(0, 6000)}
-----

規模: ノードは全体で${total}。中心から${branches}の大きな枝を出し、それぞれに2〜5個の子、必要なところだけ孫（最大3階層）。

書き方のルール:
- 1行目は「# 」で始まる中心テーマ（短い名前）。
- その下はMarkdownの箇条書き「- 」だけ。インデントは半角スペース2つ。
- 各ノードは短い言葉で（20文字程度まで）。文章や説明、前置き、まとめは書かない。
- 同じ言葉のノードを作らない。
- 最後に「%%つながり」という行を書き、その下に、別々の枝にあって関係が深いノードの組を最大3つ、
  「- ノードA <-> ノードB : 関係をひとこと」の形で書く。ノード名は上と一字一句同じ表記にする。`;
}
function openGenerate(){
  if (!sampleFn) return;
  let size = 'm';
  openModal(`<h2>AIでマップを作る</h2>
    <p>テーマや、考えていることのメモを書いてください。Claudeが枝分かれしたマインドマップにして、新しいマップとして追加します。</p>
    <textarea id="aiTopic" style="min-height:120px" placeholder="例：来月の家族旅行の計画&#10;例：新しいカフェを開くために考えること&#10;例：会議のメモをそのまま貼り付け"></textarea>
    <div class="tabs" id="aiSize">${Object.entries(SIZES).map(([k, v]) => `<button data-k="${k}" class="${k === size ? 'on' : ''}">${v[0]}</button>`).join('')}</div>
    <pre id="aiOut" hidden></pre>
    <div class="btns"><button class="b" id="aiClose">閉じる</button><button class="b pri" id="aiGo">作成する</button></div>`);
  setTimeout(() => $('#aiTopic').focus(), 30);
  document.querySelectorAll('#aiSize button').forEach(b => b.onclick = () => {
    size = b.dataset.k; document.querySelectorAll('#aiSize button').forEach(x => x.classList.toggle('on', x === b));
  });
  $('#aiClose').onclick = () => { if (aiCtl) aiCtl.abort(); closeModal(); };
  $('#aiGo').onclick = async () => {
    if (aiCtl){ aiCtl.abort(); return; }
    const topic = $('#aiTopic').value.trim();
    if (!topic){ $('#aiTopic').focus(); return; }
    const out = $('#aiOut'); out.hidden = false; out.textContent = '考えています…（少し時間がかかります）';
    $('#aiGo').textContent = '止める';
    const ctl = aiCtl = new AbortController();
    try {
      const {text} = await sampleFn(genPrompt(topic, size), {signal: ctl.signal, cache: false,
        onText: ({text}) => { const o = $('#aiOut'); if (o){ o.textContent = splitLinks(text)[0].trim(); o.scrollTop = o.scrollHeight; } }});
      const [tree, linkPart] = splitLinks(text);
      const st = parseMarkdown(tree, '');
      if (!st || Object.keys(st.nodes).length < 2){ const o = $('#aiOut'); if (o) o.textContent = 'マップにできる形で返ってきませんでした。もう一度お試しください'; return; }
      delete st.synthetic;
      st.title = st.nodes[st.rootId].label;
      st.links = parseAILinks(linkPart, st);
      if (!$('#modal').hidden && $('#aiOut')) closeModal();
      hideHome(); createMap(st, true, 'AIでマップを作りました'); swoop();
    } catch(e){
      const m = aiErr(e && e.code), o = $('#aiOut');
      if (o){ o.textContent = m; o.hidden = !m; }
    } finally {
      if (aiCtl === ctl) aiCtl = null;
      const g = $('#aiGo'); if (g) g.textContent = '作成する';
    }
  };
}
async function expandAI(target){
  if (!sampleFn || aiCtl) return;
  const n = state.nodes[target]; if (!n) return;
  const path = []; for (let c = n; c; c = c.parent ? state.nodes[c.parent] : null) path.unshift(c.label);
  const kids = n.children.map(k => state.nodes[k].label);
  const prompt = `マインドマップのノード「${n.label}」に、新しい子ノードのアイデアを足してください。

中心テーマから「${n.label}」までの道筋: ${path.join(' > ')}
「${n.label}」に今ある子: ${kids.length ? kids.join('、') : '（まだない）'}

マップ全体（参考）:
${toOutline().slice(0, 5000)}

ルール:
- 今ある子と重ならない、新しいアイデアを4〜6個。必要なものだけ、その下に1〜3個の子を付けてよい。
- Markdownの箇条書き「- 」だけで答える。インデントは半角スペース2つ。
- 各ノードは短い言葉で（20文字程度まで）。前置き・説明・まとめは書かない。`;
  const ctl = aiCtl = new AbortController();
  const mapAtStart = curId;
  showAIBar(`「${trim(n.label)}」のアイデアを考えています…`);
  try {
    const {text} = await sampleFn(prompt, {signal: ctl.signal, cache: false});
    if (curId === mapAtStart && state.nodes[target]) graftText(splitLinks(text)[0], target);
  } catch(e){ const m = aiErr(e && e.code); if (m) toast(m); }
  finally { if (aiCtl === ctl) aiCtl = null; hideAIBar(); }
}
$('#mAI').onclick = () => { closeMenu(); openGenerate(); };
$('#hAI').onclick = openGenerate;
$('#cAI').onclick = () => { const t = ctxTarget; hideCtx(); expandAI(t); };
$('#aiExpand').onclick = () => { if (selected) expandAI(selected); };

/* ---------- boot ---------- */
function loadState(s, doLayout){
  layoutAnim = null;
  state = s; selected = null;
  fixLinks();
  if (state.lv !== 3){ doLayout = true; state.lv = 3; for (const id in state.nodes) delete state.nodes[id].off; }
  if (doLayout){ const P = computeLayout(); for (const id in P) state.nodes[id].pos = P[id]; }
  syncAll(); fitAll(true); save();
}
(function boot(){
  resize();
  try { maps = JSON.parse(ls.get(STORE_MAPS) || '{}') || {}; } catch(e){ maps = {}; }
  if (!Object.keys(maps).length){
    let old = null; try { old = JSON.parse(ls.get(STORE) || 'null'); } catch(e){}
    if (validState(old)) maps[mapId()] = {title: old.title || '無題のマップ', updated: Date.now(), json: JSON.stringify(old)};
  }
  curId = ls.get(STORE_CUR);
  if (!maps[curId]) curId = Object.keys(maps).sort((a, b) => (maps[b].updated || 0) - (maps[a].updated || 0))[0] || null;
  if (curId) openMap(curId, true);
  else { const smp = parseOutline(SAMPLE); smp.title = '新しいアプリ企画（サンプル）'; createMap(smp, true, '', true); }
  setSync('local');
  startCloud();
  showHome();
  if (!ls.get(STORE+'.hint4')) showHint();
  updateHistoryBtns();
  requestAnimationFrame(loop);
})();
})();
</script>
